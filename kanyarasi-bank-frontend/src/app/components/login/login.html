<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Kanyarasi Bank</h1>
      <p>Welcome Back</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="username" 
          name="username"
          placeholder="Enter your username"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>
      
      <div *ngIf="error" class="error-message" [class.rejected-account]="error.includes('rejected') || error.includes('Kanyarasi bank branch')">
        {{ error }}
      </div>
      
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>
    
    <div class="register-link">
      <p>Don't have an account? <a (click)="navigateToRegister()">Register here</a></p>
    </div>
  </div>
</div>
